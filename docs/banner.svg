<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="mod-classless-wildcard - Ascension-style classless progression and Season 10 Wildcard rolls for AzerothCore">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="45%" stop-color="#141a28"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c060" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#a06a20" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a335ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a335ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeec2"/>
      <stop offset="38%" stop-color="#f2cd7a"/>
      <stop offset="62%" stop-color="#d9a33f"/>
      <stop offset="100%" stop-color="#a9741d"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9a33f" stop-opacity="0"/>
      <stop offset="12%" stop-color="#f2cd7a" stop-opacity="1"/>
      <stop offset="88%" stop-color="#d9a33f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d9a33f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dieFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2434"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <ellipse cx="1045" cy="178" rx="330" ry="250" fill="url(#glow)"/>
  <ellipse cx="150" cy="300" rx="300" ry="200" fill="url(#glowPurple)"/>

  <!-- rune grid -->
  <g stroke="#c8952f" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 60h1280M0 120h1280M0 180h1280M0 240h1280M0 300h1280"/>
    <path d="M60 0v360M180 0v360M300 0v360M420 0v360M540 0v360M660 0v360M780 0v360M900 0v360M1020 0v360M1140 0v360M1260 0v360"/>
  </g>

  <!-- frame -->
  <rect x="14" y="14" width="1252" height="332" fill="none" stroke="#c8952f" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="22" y="22" width="1236" height="316" fill="none" stroke="#c8952f" stroke-opacity="0.16" stroke-width="1"/>
  <g fill="#f2cd7a" fill-opacity="0.75">
    <path d="M14 14h44v3H14zM14 14v44h3V14z"/>
    <path d="M1266 14h-44v3h44zM1266 14v44h-3V14z"/>
    <path d="M14 346h44v-3H14zM14 346v-44h3v44z"/>
    <path d="M1266 346h-44v-3h44zM1266 346v-44h-3v44z"/>
  </g>

  <!-- the d20: ten faces, ten class colors -->
  <g>
    <polygon points="1045,66 1141.99,122 1141.99,234 1045,290 948.01,234 948.01,122" fill="url(#dieFill)"/>
    <g stroke="#0a0d13" stroke-width="1.25" stroke-linejoin="round">
      <polygon points="996.5,150 948.01,122 1045,66"    fill="#C79C6E" fill-opacity="0.80"/>
      <polygon points="996.5,150 1045,66 1093.5,150"    fill="#F58CBA" fill-opacity="0.80"/>
      <polygon points="1093.5,150 1045,66 1141.99,122"  fill="#ABD473" fill-opacity="0.80"/>
      <polygon points="1093.5,150 1141.99,122 1141.99,234" fill="#FFF569" fill-opacity="0.80"/>
      <polygon points="1093.5,150 1141.99,234 1045,234" fill="#FFFFFF" fill-opacity="0.72"/>
      <polygon points="1045,234 1141.99,234 1045,290"   fill="#C41F3B" fill-opacity="0.80"/>
      <polygon points="1045,234 1045,290 948.01,234"    fill="#0070DE" fill-opacity="0.80"/>
      <polygon points="1045,234 948.01,234 996.5,150"   fill="#69CCF0" fill-opacity="0.80"/>
      <polygon points="996.5,150 948.01,234 948.01,122" fill="#9482C9" fill-opacity="0.80"/>
      <polygon points="996.5,150 1093.5,150 1045,234"   fill="#FF7D0A" fill-opacity="0.28"/>
    </g>
    <polygon points="1045,66 1141.99,122 1141.99,234 1045,290 948.01,234 948.01,122" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="996.5,150 1093.5,150 1045,234" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
    <text x="1045" y="192" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif" font-size="46" font-weight="bold" fill="url(#gold)">20</text>
  </g>

  <!-- title block -->
  <text x="72" y="112" font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif" font-size="17" letter-spacing="6.5" fill="#8fa3c4">AZEROTHCORE  ·  WOTLK 3.3.5a  ·  MODULE</text>

  <text x="70" y="192" font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif" font-size="72" font-weight="bold" letter-spacing="2" fill="url(#gold)">CLASSLESS</text>
  <text x="70" y="262" font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif" font-size="72" font-weight="bold" letter-spacing="2" fill="#e8ecf5">WILDCARD</text>

  <rect x="72" y="284" width="640" height="2" fill="url(#goldLine)"/>
  <text x="72" y="316" font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif" font-size="19" fill="#a7b6cf">Every spell. Every talent. Every class. Or let the dice decide.</text>

  <!-- rarity ladder -->
  <g>
    <rect x="72" y="332" width="86" height="5" fill="#9d9d9d"/>
    <rect x="164" y="332" width="86" height="5" fill="#1eff00"/>
    <rect x="256" y="332" width="86" height="5" fill="#0070dd"/>
    <rect x="348" y="332" width="86" height="5" fill="#a335ee"/>
    <rect x="440" y="332" width="86" height="5" fill="#ff8000"/>
  </g>
</svg>
